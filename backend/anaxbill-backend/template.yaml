AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnaxBill backend — Phase 2.4a (settings + customers)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Architectures: [arm64]

Parameters:
  Stage:
    Type: String
    Default: dev
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_EfkWMBUfv
  CognitoClientId:
    Type: String
    Default: 5pdjd9qb8vk8nqnu1upt9g1vo5

Resources:

  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnaxBill_Settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: companyId
          AttributeType: S
      KeySchema:
        - AttributeName: companyId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnaxBill_Customers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: companyId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: companyId
          KeyType: HASH
        - AttributeName: customerId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "https://develop.d1jdrhajlzub2z.amplifyapp.com"
          - "http://localhost:5173"
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoClientId

  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anaxbill-settings
      CodeUri: ./
      Handler: settings/app.handler
      Environment:
        Variables:
          SETTINGS_TABLE: !Ref SettingsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SettingsTable }
      Events:
        SettingsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /settings
            Method: GET
            Auth: { Authorizer: CognitoAuthorizer }
        SettingsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /settings
            Method: PUT
            Auth: { Authorizer: CognitoAuthorizer }

  CustomersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anaxbill-customers
      CodeUri: ./
      Handler: customers/app.handler
      Environment:
        Variables:
          CUSTOMERS_TABLE: !Ref CustomersTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CustomersTable }
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /customers
            Method: GET
            Auth: { Authorizer: CognitoAuthorizer }
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /customers
            Method: POST
            Auth: { Authorizer: CognitoAuthorizer }
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /customers/{id}
            Method: GET
            Auth: { Authorizer: CognitoAuthorizer }
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /customers/{id}
            Method: PUT
            Auth: { Authorizer: CognitoAuthorizer }
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /customers/{id}
            Method: DELETE
            Auth: { Authorizer: CognitoAuthorizer }

Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
