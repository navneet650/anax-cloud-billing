AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnaxBill backend — Step 2.3 (settings Lambda only)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Architectures: [arm64]

Parameters:
  Stage:
    Type: String
    Default: dev
  CognitoUserPoolId:
    Type: String
    Default: ap-south-1_EfkWMBUfv
  CognitoClientId:
    Type: String
    Default: 5pdjd9qb8vk8nqnu1upt9g1vo5

Resources:

  SettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnaxBill_Settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: companyId
          AttributeType: S
      KeySchema:
        - AttributeName: companyId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: AnaxBill

  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "https://develop.d1jdrhajlzub2z.amplifyapp.com"
          - "http://localhost:5173"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoClientId

  SettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anaxbill-settings
      CodeUri: ./
      Handler: settings/app.handler
      Environment:
        Variables:
          SETTINGS_TABLE: !Ref SettingsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable
      Events:
        SettingsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /settings
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        SettingsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /settings
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  ApiUrl:
    Description: "API Gateway URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  SettingsTableName:
    Value: !Ref SettingsTable
