AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnaxBill backend API

Globals:
  Function:
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON

Resources:
  AnaxBillApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: arn:aws:cognito-idp:ap-south-1:990923146026:userpool/ap-south-1_EfkWMBUfv

  AnaxBillCustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AnaxBillCustomers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: customerId
          KeyType: RANGE

  AnaxBillApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref AnaxBillApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE

  AnaxBillCustomersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: customers/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          CUSTOMERS_TABLE: !Ref AnaxBillCustomersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnaxBillCustomersTable
      Events:
        ListCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref AnaxBillApi
            Path: /customers
            Method: get
        CreateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref AnaxBillApi
            Path: /customers
            Method: post

Outputs:
  AnaxBillApi:
    Description: API Gateway endpoint URL for AnaxBill API
    Value: !Sub "https://${AnaxBillApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/health/"
  AnaxBillApiFunction:
    Description: AnaxBill API Lambda Function ARN
    Value: !GetAtt AnaxBillApiFunction.Arn
  AnaxBillCustomersFunction:
    Description: AnaxBill Customers Lambda Function ARN
    Value: !GetAtt AnaxBillCustomersFunction.Arn
  AnaxBillCustomersTable:
    Description: DynamoDB table for AnaxBill customers
    Value: !Ref AnaxBillCustomersTable
